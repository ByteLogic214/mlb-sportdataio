name: Daily MLB Projections

on:
  schedule:
    # Ejecutar todos los días a las 10:00 UTC (6:00 AM ET, antes de la mayoría de juegos)
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha a proyectar (formato: YYYY-MMM-DD, ej. 2026-SEP-05)"
        required: false
        default: ""

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "RUN_DATE=${{ github.event.inputs.date }}" >> $GITHUB_ENV
          else
            echo "RUN_DATE=$(date +%Y-%b-%d | tr '[:lower:]' '[:upper:]')" >> $GITHUB_ENV
          fi

      - name: Run MLB Projection Pipeline
        env:
          SPORTSDATA_API_KEY: ${{ secrets.SPORTSDATA_API_KEY }}
        run: |
          python orchestrator.py --date ${{ env.RUN_DATE }} --output csv

      - name: Upload projections as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlb-projections-${{ env.RUN_DATE }}
          path: mlb_projections_*.csv
          retention-days: 30

      - name: Commit projections to repository (optional)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add mlb_projections_*.csv || true
          git diff --cached --quiet || git commit -m "Daily projections ${{ env.RUN_DATE }}"
          git push || true
